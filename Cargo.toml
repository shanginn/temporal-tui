[package]
name = "temporal-tui"
version = "1.2.0"
edition = "2024"
rust-version = "1.97.1"
description = "A fast terminal dashboard and control plane for Temporal"
license = "MIT"
readme = "README.md"
repository = "https://github.com/shanginn/temporal-tui"
homepage = "https://github.com/shanginn/temporal-tui"
keywords = ["temporal", "tui", "dashboard", "workflow", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
async-trait = "0.1.91"
atomic-write-file = "0.3.0"
base64 = "0.23.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures-util = "0.3.33"
keyring = "4.1.5"
open = "5.4.0"
prost-wkt-types = "0.7.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
temporalio-client = "0.5.0"
temporalio-common = "0.5.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-width = "0.2.2"
url = "2.5.8"
zeroize = "1.9.0"

[dev-dependencies]
bytes = "1.12.1"
clap_complete = "4.6.8"
clap_mangen = "0.3.0"
http-body-util = "0.1.4"
pretty_assertions = "1.4.1"
prost = "0.14.4"
tempfile = "3.27.0"
temporalio-macros = "0.5.0"
temporalio-sdk = { version = "0.5.0", default-features = false }
temporalio-sdk-core = { version = "0.5.0", default-features = false }
temporalio-workflow = "0.5.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "test-util"] }
tokio-stream = { version = "0.1.19", features = ["net"] }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.'cfg(unix)']
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.'cfg(windows)']
pkg-fmt = "zip"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
too_many_lines = "allow"
