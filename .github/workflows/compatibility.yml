name: Temporal compatibility

on:
  push:
    branches: [master]
    paths:
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - src/**
      - tests/compatibility.rs
      - scripts/compatibility.sh
      - scripts/install-temporal-cli.sh
      - .github/workflows/compatibility.yml
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  compatibility:
    name: Server 1.29, 1.30, and 1.31
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install pinned Protobuf compiler
        run: scripts/install-protoc.sh
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run read-only compatibility matrix
        run: scripts/compatibility.sh
