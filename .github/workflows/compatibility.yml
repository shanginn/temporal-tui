name: Temporal compatibility

on:
  push:
    branches: [master]
    paths:
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - src/**
      - tests/compatibility.rs
      - scripts/compatibility.sh
      - scripts/install-temporal-cli.sh
      - .github/workflows/compatibility.yml
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  compatibility:
    name: Server 1.29, 1.30, and 1.31
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install pinned Protobuf compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run read-only compatibility matrix
        run: scripts/compatibility.sh
