name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            format: tgz
          - os: macos-26
            target: aarch64-apple-darwin
            format: tgz
          - os: macos-26-intel
            target: x86_64-apple-darwin
            format: tgz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            format: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches Cargo package version
        shell: bash
        run: |
          package_version="$(awk '/^\[package\]$/{p=1;next} /^\[/{p=0} p && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install pinned Protobuf compiler on Unix
        if: runner.os != 'Windows'
        run: scripts/install-protoc.sh
      - name: Install pinned Protobuf compiler on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/install-protoc.ps1
      - name: Install checksum-verified Temporal CLI on Unix
        if: runner.os != 'Windows'
        run: scripts/install-temporal-cli.sh
      - name: Install checksum-verified Temporal CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/install-temporal-cli.ps1
      - name: Cache Rust registry without runner-bound target artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false
      - name: Build optimized binary
        run: cargo build --locked --release
      - name: Verify Linux binary baseline
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/verify-linux-binary.sh target/release/temporal-tui
      - name: Verify Windows binary has a static CRT
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          scripts/verify-windows-binary.ps1 `
            -Binary target/release/temporal-tui.exe
      - name: Package Unix artifact
        if: matrix.format == 'tgz'
        run: scripts/package.sh "${{ matrix.target }}" dist
      - name: Package Windows artifact
        if: matrix.format == 'zip'
        shell: pwsh
        run: scripts/package.ps1 -Target "${{ matrix.target }}" -OutputDirectory dist
      - name: Verify Unix clean install, upgrade, and uninstall
        if: matrix.format == 'tgz'
        shell: bash
        run: |
          TEMPORAL_CLI="${GITHUB_WORKSPACE}/.tools/bin/temporal" \
            scripts/package-smoke.sh \
            "dist/temporal-tui-${GITHUB_REF_NAME}-${{ matrix.target }}.tgz"
      - name: Verify standalone binary installer
        if: matrix.format == 'tgz'
        shell: bash
        run: |
          scripts/installer-smoke.sh \
            "dist/temporal-tui-${GITHUB_REF_NAME}-${{ matrix.target }}.tgz" \
            "${GITHUB_REF_NAME}"
      - name: Verify Windows clean install, upgrade, and uninstall
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          scripts/package-smoke.ps1 `
            -Archive "dist/temporal-tui-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip" `
            -TemporalCli .tools/bin/temporal.exe
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: SBOM, provenance, GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --all-features --format json --spec-version 1.5
          mv temporal-tui.cdx.json dist/temporal-tui-${GITHUB_REF_NAME}.cdx.json
      - name: Generate package-manager metadata and checksums
        shell: bash
        run: |
          install -m 0755 scripts/install.sh dist/temporal-tui-installer.sh
          cd dist
          sha256sum temporal-tui-*.tgz temporal-tui-*.zip > ARCHIVE_SHA256SUMS
          cd ..
          scripts/generate-package-metadata.sh "${GITHUB_REF_NAME#v}" dist/ARCHIVE_SHA256SUMS dist
          cd dist
          sha256sum temporal-tui-*.tgz temporal-tui-*.zip temporal-tui-*.cdx.json temporal-tui-installer.sh temporal-tui.rb temporal-tui.json > SHA256SUMS
          rm ARCHIVE_SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: dist/*

  scoop:
    name: Public Scoop install and Temporal CLI extension
    needs: publish
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-verified Temporal CLI
        shell: pwsh
        run: scripts/install-temporal-cli.ps1
      - name: Install pinned Scoop
        shell: pwsh
        run: |
          $Commit = "b0ee913725139b816f9178163af0aecdba07a7ed"
          $ExpectedSha = "48f6ea398b3a3fa26fae0093d37bd85b13e7eaa5d1d4a3e208408768408e35ae"
          $Installer = Join-Path $env:RUNNER_TEMP "install-scoop.ps1"
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/ScoopInstaller/Install/$Commit/install.ps1" `
            -OutFile $Installer
          $ActualSha = (
            Get-FileHash $Installer -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($ActualSha -ne $ExpectedSha) {
            throw "Scoop installer checksum mismatch"
          }
          $ScoopDir = Join-Path $env:RUNNER_TEMP "scoop"
          $ScoopGlobalDir = Join-Path $env:RUNNER_TEMP "scoop-global"
          $ScoopCacheDir = Join-Path $env:RUNNER_TEMP "scoop-cache"
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          & $Installer `
            -RunAsAdmin `
            -ScoopDir $ScoopDir `
            -ScoopGlobalDir $ScoopGlobalDir `
            -ScoopCacheDir $ScoopCacheDir
          if ($LASTEXITCODE -ne 0) {
            throw "Scoop installation failed"
          }
          "SCOOP=$ScoopDir" | Out-File $env:GITHUB_ENV -Append
      - name: Verify exact public manifest, shim, and extension
        shell: pwsh
        run: |
          $env:PATH = "$env:SCOOP\shims;$env:PATH"
          $Scoop = Join-Path $env:SCOOP "shims/scoop.ps1"
          $Manifest = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/temporal-tui.json"
          & $Scoop install $Manifest
          if ($LASTEXITCODE -ne 0) {
            throw "Scoop could not install the public release manifest"
          }

          $ExpectedVersion = ($env:GITHUB_REF_NAME).TrimStart("v")
          $TuiVersion = (& temporal-tui.exe --version | Out-String).Trim()
          if ($TuiVersion -ne "temporal-tui $ExpectedVersion") {
            throw "unexpected Scoop-installed version: $TuiVersion"
          }
          $AllHelp = (
            & .tools/bin/temporal.exe help --all |
              Out-String
          )
          if (
            $LASTEXITCODE -ne 0 -or
            $AllHelp -notmatch "(?m)^\s{2}tui\s"
          ) {
            throw "Temporal CLI did not discover the Scoop shim"
          }
          $PluginVersion = (
            & .tools/bin/temporal.exe tui --version |
              Out-String
          ).Trim()
          if ($PluginVersion -ne "temporal-tui $ExpectedVersion") {
            throw "unexpected Temporal CLI extension version: $PluginVersion"
          }

          $InstalledBinary = Join-Path $env:SCOOP (
            "apps/temporal-tui/current/temporal-tui.exe"
          )
          scripts/temporal-cli-extension-smoke.ps1 `
            -TemporalCli .tools/bin/temporal.exe `
            -TuiBinary $InstalledBinary `
            -ExpectedVersion $ExpectedVersion

          & $Scoop uninstall temporal-tui
          if ($LASTEXITCODE -ne 0) {
            throw "Scoop uninstall failed"
          }
          if (
            Test-Path (
              Join-Path $env:SCOOP "apps/temporal-tui/current"
            )
          ) {
            throw "Scoop left the application installed"
          }
          if (Get-Command temporal-tui.exe -ErrorAction SilentlyContinue) {
            throw "Scoop left the temporal-tui shim on PATH"
          }
