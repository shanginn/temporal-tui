name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            format: tgz
          - os: macos-26
            target: aarch64-apple-darwin
            format: tgz
          - os: macos-26-intel
            target: x86_64-apple-darwin
            format: tgz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            format: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches Cargo package version
        shell: bash
        run: |
          package_version="$(awk '/^\[package\]$/{p=1;next} /^\[/{p=0} p && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install pinned Protobuf compiler on Unix
        if: runner.os != 'Windows'
        run: scripts/install-protoc.sh
      - name: Install pinned Protobuf compiler on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/install-protoc.ps1
      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build optimized binary
        run: cargo build --locked --release
      - name: Package Unix artifact
        if: matrix.format == 'tgz'
        run: scripts/package.sh "${{ matrix.target }}" dist
      - name: Package Windows artifact
        if: matrix.format == 'zip'
        shell: pwsh
        run: scripts/package.ps1 -Target "${{ matrix.target }}" -OutputDirectory dist
      - name: Verify Unix clean install, upgrade, and uninstall
        if: matrix.format == 'tgz'
        shell: bash
        run: scripts/package-smoke.sh "dist/temporal-tui-${GITHUB_REF_NAME}-${{ matrix.target }}.tgz"
      - name: Verify Windows clean install, upgrade, and uninstall
        if: matrix.format == 'zip'
        shell: pwsh
        run: scripts/package-smoke.ps1 -Archive "dist/temporal-tui-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: SBOM, provenance, GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --all-features --format json --spec-version 1.5
          mv temporal-tui.cdx.json dist/temporal-tui-${GITHUB_REF_NAME}.cdx.json
      - name: Generate package-manager metadata and checksums
        shell: bash
        run: |
          cd dist
          sha256sum temporal-tui-*.tgz temporal-tui-*.zip > ARCHIVE_SHA256SUMS
          cd ..
          scripts/generate-package-metadata.sh "${GITHUB_REF_NAME#v}" dist/ARCHIVE_SHA256SUMS dist
          cd dist
          sha256sum temporal-tui-*.tgz temporal-tui-*.zip temporal-tui-*.cdx.json temporal-tui.rb temporal-tui.json > SHA256SUMS
          rm ARCHIVE_SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: dist/*
