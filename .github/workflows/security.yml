name: Dependency policy

on:
  push:
    branches: [master]
    paths:
      - Cargo.lock
      - Cargo.toml
      - deny.toml
      - .github/workflows/security.yml
  pull_request:
    branches: [master]
    paths:
      - Cargo.lock
      - Cargo.toml
      - deny.toml
      - .github/workflows/security.yml
  schedule:
    - cron: "43 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-policy:
    name: Advisories, licenses, sources
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce cargo-deny policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked
      - name: Audit RustSec advisories
        shell: bash
        run: |
          version="0.22.2"
          package="cargo-audit-x86_64-unknown-linux-gnu-v${version}"
          archive="${RUNNER_TEMP}/${package}.tgz"
          install_dir="${RUNNER_TEMP}/cargo-audit"
          curl --fail --location --silent --show-error \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${version}/${package}.tgz" \
            --output "${archive}"
          printf '%s  %s\n' \
            "ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39" \
            "${archive}" |
            sha256sum --check -
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" \
            -C "${install_dir}" \
            --strip-components=1 \
            "${package}/cargo-audit"
          "${install_dir}/cargo-audit" audit --file Cargo.lock
