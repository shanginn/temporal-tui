name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format, lint, tests, package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Install pinned Protobuf compiler
        run: scripts/install-protoc.sh
      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run locked quality gate
        run: scripts/check.sh
      - name: Verify generated CLI assets
        run: |
          scripts/generate-assets.sh
          git diff --exit-code -- assets
      - name: Verify publishable source package
        run: cargo package --locked

  platform:
    name: Test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: ./target/release/temporal-tui
          - os: macos-26
            target: aarch64-apple-darwin
            binary: ./target/release/temporal-tui
          - os: macos-26-intel
            target: x86_64-apple-darwin
            binary: ./target/release/temporal-tui
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: ./target/release/temporal-tui.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install pinned Protobuf compiler on Unix
        if: runner.os != 'Windows'
        run: scripts/install-protoc.sh
      - name: Install pinned Protobuf compiler on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/install-protoc.ps1
      - name: Install checksum-verified Temporal CLI on Unix
        if: runner.os != 'Windows'
        run: scripts/install-temporal-cli.sh
      - name: Install checksum-verified Temporal CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/install-temporal-cli.ps1
      - name: Cache Rust registry without runner-bound target artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false
      - name: Run tests
        run: cargo test --locked --all-targets --all-features
      - name: Build optimized binary
        run: cargo build --locked --release
      - name: Smoke-test binary
        run: ${{ matrix.binary }} --version
      - name: Verify Linux binary baseline
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/verify-linux-binary.sh "${{ matrix.binary }}"
      - name: Verify Windows binary has a static CRT
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/verify-windows-binary.ps1 -Binary "${{ matrix.binary }}"
      - name: Verify Temporal CLI extension on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="$("${{ matrix.binary }}" --version | awk '{ print $2 }')"
          scripts/temporal-cli-extension-smoke.sh \
            .tools/bin/temporal \
            "${{ matrix.binary }}" \
            "${version}"
      - name: Verify Temporal CLI extension on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = (
            (& "${{ matrix.binary }}" --version | Out-String).Trim() -split '\s+'
          )[-1]
          scripts/temporal-cli-extension-smoke.ps1 `
            -TemporalCli .tools/bin/temporal.exe `
            -TuiBinary "${{ matrix.binary }}" `
            -ExpectedVersion $Version
      - name: Verify Unix package and standalone binary installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="$("${{ matrix.binary }}" --version | awk '{print $2}')"
          archive="$(scripts/package.sh \
            "${{ matrix.target }}" dist "${{ matrix.binary }}")"
          TEMPORAL_CLI="${GITHUB_WORKSPACE}/.tools/bin/temporal" \
            scripts/package-smoke.sh "${archive}"
          scripts/installer-smoke.sh "${archive}" "${version}"
      - name: Verify Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Archive = scripts/package.ps1 `
            -Target "${{ matrix.target }}" `
            -OutputDirectory dist `
            -BinaryPath "${{ matrix.binary }}"
          scripts/package-smoke.ps1 `
            -Archive $Archive `
            -TemporalCli .tools/bin/temporal.exe

  live:
    name: Disposable Temporal live contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install pinned Protobuf compiler
        run: scripts/install-protoc.sh
      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install checksum-verified Temporal CLI
        run: scripts/install-temporal-cli.sh
      - name: Run live mutation contract
        run: cargo test --locked --test live_temporal -- --ignored --nocapture
